# Hybrid coding agent configuration (fallback: embedded defaults in agent.py)
router:
  local_threshold: 0.85
  threshold_min: 0.60
  threshold_max: 0.85
  target_local_rate: 0.93
  alpha: 0.01
  # Per-task supervision plan (--router overrides this):
  #   auto         router decides per task (default): critical/trivial signals,
  #                budget pressure, confidence + memory history, memory similarity
  #   full         always DeepSeek review (the supervise loop)
  #   local_first  skip DeepSeek review — one local pass + apply/verify only
  #   critical     force prompt enhancement + the full review loop
  supervision: auto
  weights:
    clarity: 0.30
    specificity: 0.25
    size_penalty: 0.15
    history_bonus: 0.20
    novelty: 0.10

backends:
  local:
    base_url: "http://localhost:1234/v1"   # local OpenAI-compatible endpoint (LM Studio / Ollama / ...)
    api_key: "lm-studio"                   # local endpoints usually ignore the key
    model: "google/gemma-4-12b-qat"
    # gemma4 runs in thinking mode (LM Studio ignores thinking-disable API params),
    # so legit calls can take 1-2 min. A 60s timeout was killing slow-but-working
    # calls and re-running them, doubling wall time. Raised to 180s.
    timeout_s: 180
    max_retries: 3
    backoff_s: [0.5, 1.0, 2.0]
    cold_start_wait_s: 30
  deepseek:   # the "API" backend - any OpenAI-compatible endpoint works here
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com"
    model: "deepseek-chat"
    timeout_s: 30
    max_retries: 4
    backoff_s: [1.0, 2.0, 4.0]

review:
  max_local_retries: 2
  max_depth_tokens: 600
  max_failure_summary_words: 150
  daily_token_budget: 200000
  # Final error-check stage: commands run before the task is marked complete.
  # On errors, DeepSeek analyzes the output and produces fixes that are applied
  # and re-verified (loop until clean). Empty = final check disabled.
  # Example: ["npm run build", "npx tsc --noEmit", "npm run lint"]
  verify: []
  # Per-command timeout (seconds) for verification commands (default 600).
  verify_timeout: 600
  # Optional dependency-aware parallel verify: ordered groups of commands.
  # Commands within a group run in parallel (with --verify-parallel), groups
  # run sequentially. Empty = sequential verify. Example:
  #   verify_groups:
  #     - ["npm run build", "npx tsc --noEmit", "npm run lint"]
  #     - ["npm test"]
  verify_groups: []
  # Extra allowlisted verification command prefixes (case-insensitive), added to
  # the built-in allowlist. Anything with a dangerous shell marker (rm, sudo, |,
  # >, &&, ;, ...) is still blocked regardless of this list. Example:
  #   verify_allowlist: ["docker compose build", "cargo check"]
  verify_allowlist: []
  # Regression guard: full test suite run AFTER verification passes, to catch
  # fixes that break tests elsewhere. Empty = regression guard disabled.
  # Example: ["npm test", "python -m pytest"]
  regression: []
  regression_timeout: 600
  # Terminal tool (supervise loop): per-command timeout for 'RUN: <command>'
  # blocks the model emits. Commands are still allowlist-gated.
  terminal_timeout: 120

cache:
  enabled: true
  dir: ".cache"
  ttl_days: 7
  max_entries: 100

circuit_breaker:
  window_size: 20
  local_error_ceiling: 0.40
  deepseek_error_ceiling: 0.30
  cooldown_s: 60

# Deploy step: runs AFTER verification passes when --deploy (or --deploy-cmd)
# is used. The command runs from deploy.cwd (default: the project root).
deploy:
  command: ""            # e.g. "docker compose up -d --build" or "git push origin main"
  cwd: ""                # default: the project root given to --root
  timeout: 1800

# BOUND (Ouro Loop pattern): hard constraints the agent can NEVER bypass.
# Enforced at runtime — files in danger zones are never written, never_do
# commands never run, and an apply that attempts a violation exits with code 2.
# --no-bound disables enforcement (user-level escape hatch only).
bound:
  danger_zones:
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - ".git/**"
    - ".kilo/**"
    - "Agents /hybrid-agent/**"
    - "**/memory/**"
    - "**/.cache/**"
  never_do:
    - "rm -rf"
    - "git push --force"
    - "git reset --hard"
    - "git clean -f"
    - "chmod 777"
    - "sudo "
    - "shutdown"
    - "reboot"
    - "mkfs"
  iron_laws:
    - "Never modify or create secrets, credentials, .env files, private keys, or certs."
    - "Never run destructive git operations (force push, hard reset, clean, delete)."
    - "Never write files outside the project root or inside declared danger zones."
    - "Never modify the agent's own configuration, memory, or cache."
    - "Never bypass, disable, or weaken the BOUND or the verification gates."
    - "Always leave the project in a building state; revert if you cannot verify."

# Bounded-autonomy program: phases with verification gates and a remediation
# playbook (retry / revert / escalate). Runs inside the verify stage when
# configured. Empty = phases disabled (the standard --verify flow runs).
program:
  phases: []
  # Example:
  # phases:
  #   - name: build
  #     gate: ["npm run build"]
  #     max_fix_rounds: 2
  #     on_fail: retry        # retry | revert | escalate
  #   - name: journeys        # user journeys from a journeys.yml DSL (headless browser)
  #     journeys: "journeys.yml"
  #     on_fail: retry
  #   - name: test
  #     gate: ["npm test"]
  #     on_fail: escalate

# Journey verification (Vibe DSL): user journeys defined in journeys.yml are
# run headlessly (Playwright). The journeys file is BOUND-protected (Write-One):
# the agent can fix source code but can never modify the tests themselves.
journey:
  file: "journeys.yml"
  browser: "chromium"
  timeout_s: 30
  screenshots_dir: "hybrid-verify/screenshots"

memory:
  root: "./memory"
  max_project_summary_words: 200
  # Semantic memory: local embeddings (LM Studio /v1/embeddings) make similar-task
  # recall resilient to paraphrasing ("fix the login bug" ~ "resolve auth issue").
  # Falls back to word-trigrams on any failure or when the endpoint is down.
  semantic_similarity: true
  embedding_model: "text-embedding-nomic-embed-text-v1.5"
  embedding_threshold: 0.60

# Multi-model providers: ANY OpenAI-compatible endpoint works in either role.
# 2 online + 2 local by default; manage keys and settings via the web dashboard
# (keys never stored in this file). API keys resolve: env var -> Kilo auth.json
# -> dashboard secrets store. --online-provider / --local-provider select which
# provider is primary; --turbo fans online calls out to all enabled providers.
providers:
  online:
    - name: deepseek
      base_url: "https://api.deepseek.com"
      model: "deepseek-chat"
      api_key_env: "DEEPSEEK_API_KEY"
      enabled: true
    - name: groq
      base_url: "https://api.groq.com/openai/v1"
      model: "llama-3.3-70b-versatile"
      api_key_env: "GROQ_API_KEY"
      enabled: true
  local:
    - name: gemma
      base_url: "http://localhost:1234/v1"
      model: "google/gemma-4-12b-qat"
      api_key: "lm-studio"
      timeout_s: 180
      max_retries: 3
      enabled: true
    - name: local-2
      base_url: "http://localhost:1234/v1"
      model: "qwen2.5-coder-7b-instruct"
      api_key: "lm-studio"
      timeout_s: 180
      max_retries: 3
      enabled: true

# Roles are architecture (permanent); model names are configuration.
# The implementer is the local backend; the supervisor is the API backend.
# Runtime overrides (env): LOCAL_MODEL, LOCAL_BASE_URL, LOCAL_API_KEY,
# API_MODEL, API_BASE_URL, API_KEY_ENV. Example - swap the API supervisor to
# another OpenAI-compatible vendor:
#   API_BASE_URL=https://api.groq.com/openai/v1 API_MODEL=llama-3.3-70b-versatile
#   API_KEY_ENV=GROQ_API_KEY
roles:
  implementer: "local"
  supervisor: "deepseek"