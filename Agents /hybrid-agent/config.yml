# Hybrid coding agent configuration (fallback: embedded defaults in agent.py)
router:
  local_threshold: 0.85
  threshold_min: 0.60
  threshold_max: 0.85
  target_local_rate: 0.93
  alpha: 0.01
  weights:
    clarity: 0.30
    specificity: 0.25
    size_penalty: 0.15
    history_bonus: 0.20
    novelty: 0.10

backends:
  local:
    base_url: "http://localhost:1234/v1"   # local OpenAI-compatible endpoint (LM Studio / Ollama / ...)
    api_key: "lm-studio"                   # local endpoints usually ignore the key
    model: "google/gemma-4-12b-qat"
    # gemma4 runs in thinking mode (LM Studio ignores thinking-disable API params),
    # so legit calls can take 1-2 min. A 60s timeout was killing slow-but-working
    # calls and re-running them, doubling wall time. Raised to 180s.
    timeout_s: 180
    max_retries: 3
    backoff_s: [0.5, 1.0, 2.0]
    cold_start_wait_s: 30
  deepseek:   # the "API" backend - any OpenAI-compatible endpoint works here
    api_key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com"
    model: "deepseek-chat"
    timeout_s: 30
    max_retries: 4
    backoff_s: [1.0, 2.0, 4.0]

review:
  max_local_retries: 2
  max_depth_tokens: 600
  max_failure_summary_words: 150
  daily_token_budget: 200000
  # Final error-check stage: commands run before the task is marked complete.
  # On errors, DeepSeek analyzes the output and produces fixes that are applied
  # and re-verified (loop until clean). Empty = final check disabled.
  # Example: ["npm run build", "npx tsc --noEmit", "npm run lint"]
  verify: []
  # Per-command timeout (seconds) for verification commands (default 600).
  verify_timeout: 600
  # Optional dependency-aware parallel verify: ordered groups of commands.
  # Commands within a group run in parallel (with --verify-parallel), groups
  # run sequentially. Empty = sequential verify. Example:
  #   verify_groups:
  #     - ["npm run build", "npx tsc --noEmit", "npm run lint"]
  #     - ["npm test"]
  verify_groups: []
  # Regression guard: full test suite run AFTER verification passes, to catch
  # fixes that break tests elsewhere. Empty = regression guard disabled.
  # Example: ["npm test", "python -m pytest"]
  regression: []
  regression_timeout: 600

cache:
  enabled: true
  dir: ".cache"
  ttl_days: 7
  max_entries: 100

circuit_breaker:
  window_size: 20
  local_error_ceiling: 0.40
  deepseek_error_ceiling: 0.30
  cooldown_s: 60

memory:
  root: "./memory"
  max_project_summary_words: 200

# Roles are architecture (permanent); model names are configuration.
# The implementer is the local backend; the supervisor is the API backend.
# Runtime overrides (env): LOCAL_MODEL, LOCAL_BASE_URL, LOCAL_API_KEY,
# API_MODEL, API_BASE_URL, API_KEY_ENV. Example - swap the API supervisor to
# another OpenAI-compatible vendor:
#   API_BASE_URL=https://api.groq.com/openai/v1 API_MODEL=llama-3.3-70b-versatile
#   API_KEY_ENV=GROQ_API_KEY
roles:
  implementer: "local"
  supervisor: "deepseek"